<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les formes géométriques</title>
<meta name="description" content="Observer six figures et écrire leur nom : triangle, losange, rectangle, carré, forme convexe et forme concave.">
<meta name="keywords" content="géométrie, formes, figures, triangle, carré, rectangle, losange, convexe, concave">
<meta name="worksheet:subject" content="Mathématiques">
<meta name="worksheet:level" content="4P">
<meta name="worksheet:added" content="2026-09-29">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    color-scheme: light;
    --ink: #1f2933;
    --rule: #cfd6dd;
    --model-bg: #f3f6f9;
  }

  * { box-sizing: border-box; }

  html { background: #e9edf1; }

  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* A4 sheet */
  .page {
    width: 210mm;
    height: 297mm;
    margin: 10mm auto;
    padding: 12mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
  }

  header { text-align: center; }
  h1 { margin: 0; font-size: 24pt; letter-spacing: .3pt; }
  header p { margin: 2mm 0 0; font-size: 12pt; }

  /* The six figures */
  .grid {
    flex: 1;
    min-height: 0;
    margin-top: 6mm;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-template-rows: repeat(3, minmax(0, 1fr));
    gap: 6mm;
  }

  .card {
    margin: 0;
    padding: 4mm 5mm 5mm;
    display: flex;
    flex-direction: column;
    min-height: 0;
    border: .35mm solid var(--rule);
    border-radius: 4mm;
    break-inside: avoid;
  }

  .figure { flex: 1; min-height: 0; position: relative; }
  .figure svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* Line on which the pupil writes the name */
  .line { position: relative; flex: none; height: 14mm; border-bottom: .45mm solid var(--ink); }

  /* Keyboard input: a transparent field laid over each area where the pupil writes.
     Typed text is printed. */
  .answer-input {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font: inherit;
    color: #1864ab;
    text-align: center;
    background: transparent;
    border: 0;
    border-radius: 1.5mm;
    outline: none;
  }
  .answer-input:focus { background: rgba(28, 126, 214, .08); box-shadow: 0 0 0 .4mm #1c7ed6; }
  @media print { .answer-input { background: none !important; box-shadow: none !important; } }
  .line .answer-input { height: 10mm; font-size: 15pt; }

  .shape { stroke-width: 4; stroke-linejoin: round; }
  .s1 { fill: #ffe08a; stroke: #b8860b; }
  .s2 { fill: #ffb3c1; stroke: #c2185b; }
  .s3 { fill: #a5d8ff; stroke: #1c7ed6; }
  .s4 { fill: #b2f2bb; stroke: #2f9e44; }
  .s5 { fill: #d0bfff; stroke: #6741d9; }
  .s6 { fill: #ffd8a8; stroke: #e8590c; }

  /* List of names */
  .model {
    margin-top: 6mm;
    padding: 3.5mm 5mm 4mm;
    border: .35mm solid var(--rule);
    border-radius: 4mm;
    background: var(--model-bg);
  }
  .model h2 { margin: 0 0 2.5mm; font-size: 11pt; font-weight: normal; text-align: center; }
  .model ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2.5mm 4mm;
  }
  .model li { text-align: center; font-size: 17pt; font-weight: bold; }

  .print-btn {
    position: fixed;
    top: 12px;
    right: 16px;
    padding: 8px 16px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: #1c7ed6;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  @media print {
    html, body { background: #fff; }
    .page { margin: 0; height: 296mm; box-shadow: none; }
    .print-btn { display: none; }
  }

  /* Link to the list of all worksheets (screen only) */
  .back-link {
    position: fixed;
    top: 12px;
    left: 16px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    color: #1864ab;
    text-decoration: none;
    background: #fff;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1.5px #1864ab;
  }
  .back-link:hover { background: #e7f5ff; }
  @media print { .back-link { display: none; } }

  /* Author and license, printed in the bottom margin of each sheet */
  .page { position: relative; }
  .page::after {
    content: "Exercices scolaires · ctalpaert.github.io/exercices-scolaires · Licence CC BY-NC-SA 4.0 · pas d’utilisation commerciale";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 1.2mm;
    font: 6.5pt/1 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: #7b8591;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← Tous les exercices</a>

<button class="print-btn" type="button" onclick="window.print()">Imprimer</button>

<main class="page">
  <header>
    <h1>Les formes géométriques</h1>
    <p>Observe chaque figure, puis écris son nom sur la ligne.</p>
  </header>

  <div class="grid">
    <!-- 1. Triangle -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 1">
          <polygon class="shape s1" points="100,8 20,122 180,122"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 2. Rhombus -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 2">
          <polygon class="shape s2" points="100,10 185,65 100,120 15,65"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 3. Rectangle -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 3">
          <rect class="shape s3" x="15" y="20" width="170" height="90"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 4. Square -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 4">
          <rect class="shape s4" x="48" y="13" width="104" height="104"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 4" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 5. Convex shape: irregular pentagon -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 5">
          <polygon class="shape s5" points="50,14 142,22 180,72 112,118 20,90"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 5" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 6. Concave shape: arrowhead -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 6">
          <polygon class="shape s6" points="100,10 180,118 100,72 20,118"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>
  </div>

  <section class="model" aria-labelledby="model-title">
    <h2 id="model-title">Pour t'aider, voici le nom des figures :</h2>
    <ul>
      <li>Triangle</li>
      <li>Losange</li>
      <li>Rectangle</li>
      <li>Carré</li>
      <li>Forme convexe</li>
      <li>Forme concave</li>
    </ul>
  </section>
</main>

<script>
  // Enter moves to the next input field, like Tab
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.classList.contains("answer-input")) return;
    e.preventDefault();
    const fields = [...document.querySelectorAll(".answer-input")];
    fields[fields.indexOf(e.target) + 1]?.focus();
  });
</script>

</body>
</html>

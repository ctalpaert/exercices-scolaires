<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les formes géométriques</title>
<meta name="description" content="Observer six figures et écrire leur nom : triangle, losange, rectangle, carré, forme convexe et forme non-convexe.">
<meta name="keywords" content="géométrie, formes, figures, triangle, carré, rectangle, losange, convexe, non-convexe">
<meta name="worksheet:subject" content="Mathématiques">
<meta name="worksheet:level" content="4P">
<meta name="worksheet:added" content="2026-09-29">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">
<link rel="stylesheet" href="assets/worksheet.css">
<link rel="stylesheet" href="assets/worksheet-shapes.css">
<style>
  /* The six figures */
  .grid { margin-top: 6mm; }
  .model li { font-size: 17pt; }
</style>
</head>
<body>

<button type="button" class="menu-toggle" aria-expanded="false" aria-controls="toolbar" aria-label="Menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-open" d="M4 6h16M4 12h16M4 18h16"/><path class="icon-close" d="M6 6l12 12M18 6 6 18"/></svg>
</button>

<div class="toolbar" id="toolbar">
  <a class="back-link" href="index.html">← Tous les exercices</a>
  <button type="button" onclick="window.print()">Imprimer</button>
  <button type="button" class="secondary" id="btn-clear">Effacer mes réponses</button>
</div>

<main class="page">
  <header>
    <h1>Les formes géométriques</h1>
    <p>Observe chaque figure, puis écris son nom sur la ligne.</p>
  </header>

  <div class="grid">
    <!-- 1. Triangle -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 1">
          <polygon class="shape s1" points="100,8 20,122 180,122"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 1" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 2. Rhombus -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 2">
          <polygon class="shape s2" points="100,10 185,65 100,120 15,65"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 2" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 3. Rectangle -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 3">
          <rect class="shape s3" x="15" y="20" width="170" height="90"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 3" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 4. Square -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 4">
          <rect class="shape s4" x="48" y="13" width="104" height="104"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 4" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 5. Convex shape: irregular pentagon -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 5">
          <polygon class="shape s5" points="50,14 142,22 180,72 112,118 20,90"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 5" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>

    <!-- 6. Non-convex shape: arrowhead -->
    <figure class="card">
      <div class="figure">
        <svg viewBox="0 0 200 130" role="img" aria-label="Figure 6">
          <polygon class="shape s6" points="100,10 180,118 100,72 20,118"/>
        </svg>
      </div>
      <div class="line"><input class="answer-input" type="text" aria-label="Nom de la figure 6" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    </figure>
  </div>

  <section class="model" aria-labelledby="model-title">
    <h2 id="model-title">Pour t’aider, voici le nom des figures&nbsp;:</h2>
    <ul>
      <li>Triangle</li>
      <li>Losange</li>
      <li>Rectangle</li>
      <li>Carré</li>
      <li>Forme convexe</li>
      <li>Forme non-convexe</li>
    </ul>
  </section>
</main>

<script src="assets/worksheet.js"></script>
<script>
  Worksheet.start();
</script>

</body>
</html>

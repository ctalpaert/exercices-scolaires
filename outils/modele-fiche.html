<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  MODÈLE DE FICHE : copier ce fichier, le renommer (minuscules, tirets, sans accent),
  puis remplacer tout ce qui est entre [crochets]. Conventions : voir CLAUDE.md.
-->
<title>[Titre de la fiche]</title>
<meta name="description" content="[Une phrase qui dit ce que l’élève fait : verbe à l’infinitif, 160 caractères max.]">
<meta name="keywords" content="[mot-clé, mot-clé, mot-clé]">
<meta name="exercice:matiere" content="[Français]">
<meta name="exercice:niveau" content="[4P]">
<meta name="exercice:ajout" content="[AAAA-MM-JJ]">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    color-scheme: light;
    --ink: #1f2933;
    --purple: #5146e5;
    --purple-soft: #f2f1fe;
    --pink: #d6528c;
    --green: #3fa45b;
    --orange: #ec9a2f;
    --answer: #e03131;
  }

  * { box-sizing: border-box; }

  html { background: #e9edf1; }

  body {
    margin: 0;
    font-family: "Lexend", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Feuille A4 (une <main class="page"> par feuille) */
  .page {
    width: 210mm;
    height: 297mm;
    margin: 10mm auto;
    padding: 7mm 9mm 4mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
  }

  /* En-tête : titre, étoiles d'auto-évaluation, prénom et date */
  .head {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4mm;
    padding: 3mm 6mm;
    border: .5mm solid var(--purple);
    border-radius: 4mm;
    background: var(--purple-soft);
  }
  .head h1 { margin: 0; font-size: 18pt; font-weight: 700; color: var(--purple); white-space: nowrap; }
  .stars { font-size: 15pt; letter-spacing: 1.5mm; color: #444; }
  .ident { justify-self: end; display: grid; gap: 3mm; font-size: 9pt; font-weight: 500; }
  .ident div { white-space: nowrap; display: flex; align-items: flex-end; justify-content: flex-end; gap: 2mm; }
  .ident i { width: 38mm; border-bottom: .35mm dotted var(--ink); }
  .badge {
    display: none;
    position: absolute;
    top: -3mm;
    left: 50%;
    transform: translateX(-50%);
    padding: .8mm 4mm;
    font-size: 8.5pt;
    font-weight: 700;
    color: #fff;
    background: var(--answer);
    border-radius: 3mm;
  }

  /* Blocs d'exercice : chaque bloc a sa couleur d'accent */
  .ex {
    position: relative;
    margin-top: 6mm;
    padding: 5mm 5mm 4mm;
    border: .45mm solid var(--border);
    border-radius: 4mm;
  }
  .tab {
    position: absolute;
    top: -3.4mm;
    left: -.45mm;
    padding: 1.2mm 4mm;
    font-size: 8.5pt;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border-radius: 3mm;
  }
  .consigne { margin: 0; font-size: 11pt; font-weight: 500; line-height: 1.4; }

  .ex1 { --accent: var(--pink); --border: #efb2cb; }
  .ex2 { --accent: var(--green); --border: #a9dab6; }
  .ex3 { --accent: var(--orange); --border: #f3c888; }

  /* Réponses du corrigé : masquées tant que le corrigé n'est pas affiché */
  .ans { visibility: hidden; color: var(--answer); }
  body.corrige .ans { visibility: visible; }
  body.corrige .badge { display: inline-block; }

  /* Saisie au clavier : champ transparent posé sur chaque zone où l'élève écrit.
     Le texte tapé s'imprime ; il est masqué quand le corrigé est affiché. */
  .saisie {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font: inherit;
    color: #1864ab;
    text-align: center;
    background: transparent;
    border: 0;
    border-radius: 1.5mm;
    outline: none;
  }
  .saisie:focus { background: rgba(28, 126, 214, .08); box-shadow: 0 0 0 .4mm #1c7ed6; }
  body.corrige .saisie { visibility: hidden; }
  @media print { .saisie { background: none !important; box-shadow: none !important; } }

  /* Lignes d'écriture */
  .lines { margin: 3mm 0 0; padding: 0; list-style: none; }
  .lines li { height: 10mm; display: flex; align-items: flex-end; gap: 3mm; font-size: 12pt; }
  .write { position: relative; flex: 1; padding-left: 1.5mm; line-height: 1; border-bottom: .3mm dotted #8c7a5c; }
  .write .saisie { height: 8mm; padding: 1.5mm 0 0 1.5mm; text-align: left; }

  footer {
    margin-top: auto;
    padding-top: 2mm;
    text-align: center;
    font-size: 8.5pt;
    font-weight: 500;
    color: #8b82dd;
  }

  /* Boutons (écran uniquement) */
  .toolbar {
    position: fixed;
    top: 12px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .toolbar button {
    padding: 8px 16px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: #1c7ed6;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .toolbar button.secondary { color: #1c7ed6; background: #fff; box-shadow: inset 0 0 0 1.5px #1c7ed6; }

  @media print {
    html, body { background: #fff; }
    .page { margin: 0; height: 296mm; box-shadow: none; }
    .toolbar { display: none; }
  }

  /* Lien vers la liste de tous les exercices (écran uniquement) */
  .retour {
    position: fixed;
    top: 12px;
    left: 16px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    color: #1864ab;
    text-decoration: none;
    background: #fff;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1.5px #1864ab;
  }
  .retour:hover { background: #e7f5ff; }
  @media print { .retour { display: none; } }

  /* Auteur et licence, imprimés dans la marge du bas de chaque feuille */
  .page { position: relative; }
  .page::after {
    content: "Exercices scolaires · ctalpaert.github.io/exercices-scolaires · Licence CC BY-NC-SA 4.0 · pas d’utilisation commerciale";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 1.2mm;
    font: 6.5pt/1 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: #7b8591;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Chemin vers index.html : "index.html" à la racine, "../index.html" dans un sous-dossier -->
<a class="retour" href="index.html">← Tous les exercices</a>

<div class="toolbar">
  <button type="button" onclick="window.print()">Imprimer</button>
  <!-- Si la fiche tire ses questions au hasard, ajouter :
  <button type="button" class="secondary" id="btn-new">🎲 Nouveaux exercices</button> -->
  <button type="button" class="secondary" id="btn-corrige" aria-pressed="false">Afficher le corrigé</button>
</div>

<main class="page">
  <header class="head">
    <h1>[✏️ Titre de la fiche]</h1>
    <div class="stars" aria-hidden="true">☆☆☆</div>
    <span class="badge">Corrigé</span>
    <div class="ident">
      <div>Prénom : <i></i></div>
      <div>Date : <i></i></div>
    </div>
  </header>

  <section class="ex ex1">
    <span class="tab">Exercice 1</span>
    <p class="consigne">✏️ [Consigne courte, à l’impératif, en tutoyant l’élève. Mettre le mot important en <b>gras</b>.]</p>
    <!-- Chaque zone d'écriture reçoit un champ .saisie (aria-label = ce qu'on y écrit) -->
    <ol class="lines">
      <li>[Question 1] <span class="write"><span class="ans">[réponse]</span><input class="saisie" type="text" aria-label="[Réponse 1]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
      <li>[Question 2] <span class="write"><span class="ans">[réponse]</span><input class="saisie" type="text" aria-label="[Réponse 2]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
    </ol>
  </section>

  <section class="ex ex2">
    <span class="tab">Exercice 2</span>
    <p class="consigne">⭕ [Consigne]</p>
  </section>

  <footer>Bravo pour ton travail ! 🌟</footer>
</main>

<script>
  document.getElementById("btn-corrige").addEventListener("click", e => {
    const on = document.body.classList.toggle("corrige");
    e.currentTarget.setAttribute("aria-pressed", on);
    e.currentTarget.textContent = on ? "Masquer le corrigé" : "Afficher le corrigé";
  });
  // Entrée passe au champ de saisie suivant, comme Tab
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.classList.contains("saisie")) return;
    e.preventDefault();
    const champs = [...document.querySelectorAll(".saisie")];
    champs[champs.indexOf(e.target) + 1]?.focus();
  });
</script>

</body>
</html>

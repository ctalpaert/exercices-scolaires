<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  WORKSHEET TEMPLATE: copy this file, rename it (lowercase, hyphens, no accents),
  then replace everything in [brackets]. Conventions: see CLAUDE.md.
-->
<title>[Titre de la fiche]</title>
<meta name="description" content="[Une phrase qui dit ce que l’élève fait&nbsp;: verbe à l’infinitif, 160 caractères max.]">
<meta name="keywords" content="[mot-clé, mot-clé, mot-clé]">
<meta name="worksheet:subject" content="[Français]">
<meta name="worksheet:level" content="[4P]">
<meta name="worksheet:added" content="[AAAA-MM-JJ]">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Shared files (see CLAUDE.md). Paths from tools/, where this template lives: in the copy,
     "assets/…" at the root, "../assets/…" in a subfolder (build_catalog.py checks them).
     worksheet-standard.css is the look of this template; the worksheet's own <style>, after it, adapts it -->
<link rel="stylesheet" href="../assets/worksheet.css">
<link rel="stylesheet" href="../assets/worksheet-standard.css">
<style>
  /* Writing lines */
  .lines { margin: 3mm 0 0; padding: 0; list-style: none; }
  .lines li { height: 10mm; display: flex; align-items: flex-end; gap: 3mm; font-size: 12pt; }
  .write { position: relative; flex: 1; padding-left: 1.5mm; line-height: 1; border-bottom: .3mm dotted #8c7a5c; }
  .write .answer-input { height: 8mm; padding: 1.5mm 0 0 1.5mm; text-align: left; }
</style>
</head>
<body>

<!-- Actions: back link and buttons, fixed on wide screens; below 1200px, a sidebar opened by the ☰ button -->
<button type="button" class="menu-toggle" aria-expanded="false" aria-controls="toolbar" aria-label="Menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-open" d="M4 6h16M4 12h16M4 18h16"/><path class="icon-close" d="M6 6l12 12M18 6 6 18"/></svg>
</button>

<div class="toolbar" id="toolbar">
  <!-- Path to index.html, from tools/ here: in the copy, "index.html" at the root, "../index.html" in a subfolder -->
  <a class="back-link" href="../index.html">← Tous les exercices</a>
  <button type="button" onclick="window.print()">Imprimer</button>
  <!-- If the worksheet draws its questions at random, add:
  <button type="button" class="secondary" id="btn-new">🎲 Nouveaux exercices</button> -->
  <button type="button" class="secondary" id="btn-answers" aria-pressed="false">Afficher le corrigé</button>
  <button type="button" class="secondary" id="btn-clear">Effacer mes réponses</button>
</div>

<main class="page">
  <header class="head">
    <h1>[✏️ Titre de la fiche]</h1>
    <div class="stars" aria-hidden="true">☆☆☆</div>
    <span class="badge">Corrigé</span>
    <div class="ident">
      <div>Prénom&nbsp;: <i></i></div>
      <div>Date&nbsp;: <i></i></div>
    </div>
  </header>

  <section class="ex ex1">
    <span class="tab">Exercice 1</span>
    <p class="instruction">✏️ [Consigne courte, à l’impératif, en tutoyant l’élève. Mettre le mot important en <b>gras</b>.]</p>
    <!-- Each writing area gets an .answer-input field (aria-label = what is written there) -->
    <ol class="lines">
      <li>[Question 1] <span class="write"><span class="ans">[réponse]</span><input class="answer-input" type="text" aria-label="[Réponse 1]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
      <li>[Question 2] <span class="write"><span class="ans">[réponse]</span><input class="answer-input" type="text" aria-label="[Réponse 2]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
    </ol>
  </section>

  <section class="ex ex2">
    <span class="tab">Exercice 2</span>
    <p class="instruction">⭕ [Consigne]</p>
  </section>

  <footer>Bravo pour ton travail&nbsp;! 🌟</footer>
</main>

<script src="../assets/worksheet.js"></script>
<script>
  // The worksheet's own script (assets/worksheet.js gives window.Worksheet). Fields made here:
  // Worksheet.answerInput(label, extra) (see arbres.html). Worksheet.start() comes last, once every field
  // exists: it restores the saved answers, then saves them as the pupil types.
  // Random worksheet: generate() draws the questions as plain data, render(draw) builds the page from them,
  // isValidDraw(draw) checks a saved draw; then Worksheet.start({ drawVersion, generate, render, isValidDraw })
  // (see exercices-alphabet-voyelles.html)
  Worksheet.start();
</script>

</body>
</html>

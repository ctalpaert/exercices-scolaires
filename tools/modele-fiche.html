<title>[Titre de la fiche]</title>
<meta name="description" content="[Une phrase qui dit ce que l’élève fait&nbsp;: verbe à l’infinitif, 160 caractères max.]">
<meta name="keywords" content="[mot-clé, mot-clé, mot-clé]">
<meta name="worksheet:subject" content="[Français]">
<meta name="worksheet:level" content="[4P]">
<meta name="worksheet:added" content="[AAAA-MM-JJ]">
<link rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @page { size: A4 portrait; margin: 0; }

  :root {
    color-scheme: light;
    --ink: #1f2933;
    --purple: #5146e5;
    --purple-soft: #f2f1fe;
    --pink: #d6528c;
    --green: #3fa45b;
    --orange: #ec9a2f;
    --answer: #e03131;
  }

  * { box-sizing: border-box; }

  html { background: #e9edf1; }

  body {
    margin: 0;
    font-family: "Lexend", "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* A4 sheet (one <main class="page"> per sheet) */
  .page {
    width: 210mm;
    height: 297mm;
    margin: 10mm auto;
    padding: 7mm 9mm 4mm;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .18);
  }

  /* Header: title, self-assessment stars, first name and date */
  .head {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 4mm;
    padding: 3mm 6mm;
    border: .5mm solid var(--purple);
    border-radius: 4mm;
    background: var(--purple-soft);
  }
  .head h1 { margin: 0; font-size: 18pt; font-weight: 700; color: var(--purple); white-space: nowrap; }
  .stars { font-size: 15pt; letter-spacing: 1.5mm; color: #444; }
  .ident { justify-self: end; display: grid; gap: 3mm; font-size: 9pt; font-weight: 500; }
  .ident div { white-space: nowrap; display: flex; align-items: flex-end; justify-content: flex-end; gap: 2mm; }
  .ident i { width: 38mm; border-bottom: .35mm dotted var(--ink); }
  .badge {
    display: none;
    position: absolute;
    top: -3mm;
    left: 50%;
    transform: translateX(-50%);
    padding: .8mm 4mm;
    font-size: 8.5pt;
    font-weight: 700;
    color: #fff;
    background: var(--answer);
    border-radius: 3mm;
  }

  /* Exercise blocks: each block has its accent colour */
  .ex {
    position: relative;
    margin-top: 6mm;
    padding: 5mm 5mm 4mm;
    border: .45mm solid var(--border);
    border-radius: 4mm;
  }
  .tab {
    position: absolute;
    top: -3.4mm;
    left: -.45mm;
    padding: 1.2mm 4mm;
    font-size: 8.5pt;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border-radius: 3mm;
  }
  .instruction { margin: 0; font-size: 11pt; font-weight: 500; line-height: 1.4; }

  .ex1 { --accent: var(--pink); --border: #efb2cb; }
  .ex2 { --accent: var(--green); --border: #a9dab6; }
  .ex3 { --accent: var(--orange); --border: #f3c888; }

  /* Answer key: hidden until the answers are shown */
  .ans { visibility: hidden; color: var(--answer); }
  body.show-answers .ans { visibility: visible; }
  body.show-answers .badge { display: inline-block; }

  /* Keyboard input: a transparent field laid over each area where the pupil writes.
     Typed text is printed; it is hidden while the answers are shown. */
  .answer-input {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    font: inherit;
    color: #1864ab;
    text-align: center;
    background: transparent;
    border: 0;
    border-radius: 1.5mm;
    outline: none;
  }
  .answer-input:focus { background: rgba(28, 126, 214, .08); box-shadow: 0 0 0 .4mm #1c7ed6; }
  body.show-answers .answer-input { visibility: hidden; }
  @media print { .answer-input { background: none !important; box-shadow: none !important; } }

  /* Writing lines */
  .lines { margin: 3mm 0 0; padding: 0; list-style: none; }
  .lines li { height: 10mm; display: flex; align-items: flex-end; gap: 3mm; font-size: 12pt; }
  .write { position: relative; flex: 1; padding-left: 1.5mm; line-height: 1; border-bottom: .3mm dotted #8c7a5c; }
  .write .answer-input { height: 8mm; padding: 1.5mm 0 0 1.5mm; text-align: left; }

  footer {
    margin-top: auto;
    padding-top: 2mm;
    text-align: center;
    font-size: 8.5pt;
    font-weight: 500;
    color: #8b82dd;
  }

  /* Buttons (screen only) */
  .toolbar {
    position: fixed;
    top: 12px;
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .toolbar button {
    padding: 8px 16px;
    font: inherit;
    font-size: 14px;
    color: #fff;
    background: #1c7ed6;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  .toolbar button.secondary { color: #1c7ed6; background: #fff; box-shadow: inset 0 0 0 1.5px #1c7ed6; }

  @media print {
    html, body { background: #fff; }
    .page { margin: 0; height: 296mm; box-shadow: none; }
    .toolbar { display: none; }
  }

  /* Link to the list of all worksheets (screen only) */
  .back-link {
    position: fixed;
    top: 12px;
    left: 16px;
    padding: 8px 14px;
    font: inherit;
    font-size: 14px;
    color: #1864ab;
    text-decoration: none;
    background: #fff;
    border-radius: 6px;
    box-shadow: inset 0 0 0 1.5px #1864ab;
  }
  .back-link:hover { background: #e7f5ff; }
  @media print { .back-link { display: none; } }

  /* Actions menu (screen only): below 1200px the toolbar would cover the sheet, so it becomes
     a sidebar on the right, hidden by default and opened by the ☰ button laid over the page */
  .menu-toggle { display: none; }
  .toolbar { z-index: 10; }   /* just above 1200px, the buttons may touch the sheet: keep them on top */
  @media screen and (max-width: 1199.98px) {
    /* On a phone, the browser widens the area of fixed elements to the 794px sheet: 100% (that area)
       minus 100vw (the screen) keeps the button and the menu on the screen (elsewhere: 10px and 0) */
    .menu-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      right: max(10px, 100% - 100vw + 10px);
      z-index: 11;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      color: #fff;
      background: #1c7ed6;
      border: 0;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
      cursor: pointer;
    }
    .menu-toggle svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; }
    .menu-toggle .icon-close, .menu-toggle[aria-expanded="true"] .icon-open { display: none; }
    .menu-toggle[aria-expanded="true"] .icon-close { display: inline; }
    .toolbar {
      position: fixed;
      top: 0;
      right: 0;
      right: max(0px, 100% - 100vw);
      bottom: 0;
      width: min(280px, 85vw);
      max-width: none;
      margin: 0;
      padding: 66px 16px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: stretch;
      gap: 10px;
      overflow-y: auto;
      background: #fff;
      box-shadow: -4px 0 18px rgba(0, 0, 0, .2);
      transform: translateX(100%);
      visibility: hidden;
    }
    /* It slides in, but closes at once: a closing menu must not take the focus */
    .menu-toggle[aria-expanded="true"] ~ .toolbar { transform: none; visibility: visible; transition: transform .2s ease; }
    .toolbar .back-link { position: static; display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }
    .toolbar button, .toolbar .back-link { min-height: 44px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) { .menu-toggle[aria-expanded="true"] ~ .toolbar { transition: none; } }
  @media print { .menu-toggle { display: none; } }

  /* Author and license, printed in the bottom margin of each sheet */
  .page { position: relative; }
  .page::after {
    content: "Exercices scolaires · ctalpaert.github.io/exercices-scolaires · Licence CC BY-NC-SA 4.0 · pas d’utilisation commerciale";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 1.2mm;
    font: 6.5pt/1 "Trebuchet MS", "Segoe UI", Arial, sans-serif;
    color: #7b8591;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Actions: back link and buttons, fixed on wide screens; below 1200px, a sidebar opened by the ☰ button -->
<button type="button" class="menu-toggle" aria-expanded="false" aria-controls="toolbar" aria-label="Menu">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path class="icon-open" d="M4 6h16M4 12h16M4 18h16"/><path class="icon-close" d="M6 6l12 12M18 6 6 18"/></svg>
</button>

<div class="toolbar" id="toolbar">
  <!-- Path to index.html: "index.html" at the root, "../index.html" in a subfolder -->
  <a class="back-link" href="index.html">← Tous les exercices</a>
  <button type="button" onclick="window.print()">Imprimer</button>
  <!-- If the worksheet draws its questions at random, add:
  <button type="button" class="secondary" id="btn-new">🎲 Nouveaux exercices</button> -->
  <button type="button" class="secondary" id="btn-answers" aria-pressed="false">Afficher le corrigé</button>
  <button type="button" class="secondary" id="btn-clear">Effacer mes réponses</button>
</div>

<main class="page">
  <header class="head">
    <h1>[✏️ Titre de la fiche]</h1>
    <div class="stars" aria-hidden="true">☆☆☆</div>
    <span class="badge">Corrigé</span>
    <div class="ident">
      <div>Prénom&nbsp;: <i></i></div>
      <div>Date&nbsp;: <i></i></div>
    </div>
  </header>

  <section class="ex ex1">
    <span class="tab">Exercice 1</span>
    <p class="instruction">✏️ [Consigne courte, à l’impératif, en tutoyant l’élève. Mettre le mot important en <b>gras</b>.]</p>
    <!-- Each writing area gets an .answer-input field (aria-label = what is written there) -->
    <ol class="lines">
      <li>[Question 1] <span class="write"><span class="ans">[réponse]</span><input class="answer-input" type="text" aria-label="[Réponse 1]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
      <li>[Question 2] <span class="write"><span class="ans">[réponse]</span><input class="answer-input" type="text" aria-label="[Réponse 2]" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></span></li>
    </ol>
  </section>

  <section class="ex ex2">
    <span class="tab">Exercice 2</span>
    <p class="instruction">⭕ [Consigne]</p>
  </section>

  <footer>Bravo pour ton travail&nbsp;! 🌟</footer>
</main>

<script>
  // ---- Actions menu: below 1200px, the toolbar is a sidebar opened and closed by the ☰ button ----
  (() => {
    const toggle = document.querySelector(".menu-toggle");
    const menu = document.getElementById(toggle.getAttribute("aria-controls"));
    const isOpen = () => toggle.getAttribute("aria-expanded") === "true";
    const setOpen = open => {
      if (!open && menu.contains(document.activeElement)) toggle.focus();   // the focus would be lost in the hidden menu
      toggle.setAttribute("aria-expanded", open);
    };
    toggle.addEventListener("click", () => setOpen(!isOpen()));
    // A chosen action closes the menu, to show its effect; so do Escape, a press (mouse, finger) or the focus
    // beside the menu. pointerdown, not click: Safari on iPhone and iPad may send no click for a tap on plain text
    menu.addEventListener("click", e => { if (isOpen() && e.target.closest("a, button")) setOpen(false); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && isOpen()) setOpen(false); });
    document.addEventListener("pointerdown", e => {
      if (isOpen() && !menu.contains(e.target) && !toggle.contains(e.target)) setOpen(false);
    });
    menu.addEventListener("focusout", e => {
      const to = e.relatedTarget;
      if (isOpen() && to && to !== toggle && !menu.contains(to)) setOpen(false);
    });
    // Back to a wide window: the toolbar is shown as usual
    matchMedia("(max-width: 1199.98px)").addEventListener?.("change", () => setOpen(false));
  })();

  document.getElementById("btn-answers").addEventListener("click", e => {
    const on = document.body.classList.toggle("show-answers");
    e.currentTarget.setAttribute("aria-pressed", on);
    e.currentTarget.textContent = on ? "Masquer le corrigé" : "Afficher le corrigé";
  });
  // Enter moves to the next input field, like Tab
  document.addEventListener("keydown", e => {
    if (e.key !== "Enter" || !e.target.classList.contains("answer-input")) return;
    e.preventDefault();
    const fields = [...document.querySelectorAll(".answer-input")];
    fields[fields.indexOf(e.target) + 1]?.focus();
  });

  // Random worksheet: use the random variant of this script instead (generate() returns the draw as plain
  // data, render(draw) builds the page from it): see exercices-phrases-mots.html
  // ---- Saved work: answers (and drawn questions) stay in this browser; index.html lists them ----
  // Key: path of the worksheet from the site root, as in catalog.js ("arbres.html", "Arbres/x.html"),
  // found from the back link: same key on GitHub Pages (even without ".html"), on a local server or from disk
  const storageKey = (() => {
    try {
      const root = decodeURIComponent(new URL(".", document.querySelector(".back-link").href).pathname);
      let path = decodeURIComponent(location.pathname);
      path = path.startsWith(root) ? path.slice(root.length) : path.slice(path.lastIndexOf("/") + 1);
      return `exercices-scolaires:${path.endsWith(".html") ? path : `${path}.html`}`;
    } catch (e) { return null; }
  })();
  const storage = (() => { try { return storageKey ? window.localStorage : null; } catch (e) { return null; } })();
  // Preview in index.html (#preview, or any same-origin frame): show the saved work, never change it
  const readOnly = location.hash === "#preview" || !!window.frameElement;
  let lastJson = null;   // last value read or written here, to notice changes made elsewhere

  function readWork() {
    if (!storage) return null;
    try {
      lastJson = storage.getItem(storageKey);
      const work = JSON.parse(lastJson);
      return work && work.v === 1 && Array.isArray(work.fields) ? work : null;
    } catch (e) { return null; }   // storage blocked, or not JSON
  }

  function writeWork(work) {
    if (readOnly || !storage) return;
    try {
      const json = work ? JSON.stringify({ v: 1, updated: new Date().toISOString(), ...work }) : null;
      if (json) storage.setItem(storageKey, json);
      else storage.removeItem(storageKey);
      lastJson = json;
    } catch (e) { /* storage full or blocked: the worksheet works as before */ }
  }

  const answerFields = () => [...document.querySelectorAll(".answer-input")];
  const hasAnswers = () => answerFields().some(f => f.value.trim());
  const answerList = () => answerFields().map(f => [f.getAttribute("aria-label"), f.value]);

  // Each field takes back the first unused saved answer with the same aria-label,
  // so the answers survive a field added or removed elsewhere in the worksheet
  function restoreAnswers(work) {
    const saved = (work ? work.fields : []).filter(a => Array.isArray(a) && typeof a[0] === "string" && typeof a[1] === "string");
    answerFields().forEach(f => {
      const k = saved.findIndex(([label]) => label === f.getAttribute("aria-label"));
      f.value = k < 0 ? "" : saved.splice(k, 1)[0][1];
    });
  }

  const saveWork = () => writeWork(hasAnswers() ? { fields: answerList() } : null);
  const loadWork = () => restoreAnswers(readWork());

  document.addEventListener("input", e => { if (e.target.classList.contains("answer-input")) saveWork(); });
  document.getElementById("btn-clear").addEventListener("click", () => {
    if (hasAnswers() && !confirm("Effacer toutes tes réponses ?")) return;
    answerFields().forEach(f => { f.value = ""; });
    saveWork();
  });
  // Saved work changed in another tab, or in the dialog of index.html
  window.addEventListener("storage", e => {
    if (storage && e.storageArea === storage && (e.key === storageKey || e.key === null)) loadWork();
  });
  // Back on this page from the back/forward cache: take the changes made in the meantime
  window.addEventListener("pageshow", e => {
    if (!e.persisted || !storage) return;
    try { if (storage.getItem(storageKey) !== lastJson) loadWork(); } catch (err) { /* storage blocked */ }
  });

  loadWork();
</script>

</body>
</html>
